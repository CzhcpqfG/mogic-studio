services:
  postgres:
    image: postgres:16.6-alpine
    container_name: mogic-studio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mogic_studio}
      POSTGRES_USER: ${POSTGRES_USER:-mogic_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - mogic-studio-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mogic_studio} -d ${POSTGRES_DB:-mogic_studio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${MOGIC_STUDIO_IMAGE:-ghcr.io/CzhcpqfG/mogic-studio:v0.0.6}
    container_name: mogic-studio
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - mogic-studio-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      MOGIC_STUDIO_DATA_DIR: /app/web/.data
      MOGIC_STUDIO_INTERNAL_ORIGIN: http://127.0.0.1:3000
      MOGIC_STUDIO_DATABASE_PROVIDER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-mogic_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mogic_studio}
      MOGIC_STUDIO_DATABASE_POOL_MAX: ${MOGIC_STUDIO_DATABASE_POOL_MAX:-10}
      MOGIC_STUDIO_DATABASE_SSL: "0"
      MOGIC_STUDIO_ENCRYPTION_KEY: ${MOGIC_STUDIO_ENCRYPTION_KEY:?请在 .env 中配置 MOGIC_STUDIO_ENCRYPTION_KEY}
      MOGIC_STUDIO_INSTALL_TOKEN: ${MOGIC_STUDIO_INSTALL_TOKEN:?请在 .env 中配置至少 32 位一次性安装令牌}
      MOGIC_STUDIO_MAINTENANCE_TOKEN: ${MOGIC_STUDIO_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      MOGIC_STUDIO_WORKER_TOKEN: ${MOGIC_STUDIO_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: ${MOGIC_STUDIO_IMAGE:-ghcr.io/CzhcpqfG/mogic-studio:v0.0.6}
    container_name: mogic-studio-generation-worker
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    environment:
      MOGIC_STUDIO_WORKER_API_ORIGIN: http://app:3000
      MOGIC_STUDIO_WORKER_TOKEN: ${MOGIC_STUDIO_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mogic-studio-data:
  mogic-studio-postgres:
