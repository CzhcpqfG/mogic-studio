services:
  - type: web
    name: mogic-studio
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    healthCheckPath: /api/health/live
    disk:
      name: mogic-studio-data
      mountPath: /app/web/.data
      sizeGB: 10
    envVars:
      - fromGroup: mogic-studio-runtime
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: UV_THREADPOOL_SIZE
        value: "2"
      - key: MOGIC_STUDIO_DATA_DIR
        value: /app/web/.data
      - key: MOGIC_STUDIO_INTERNAL_ORIGIN
        value: http://127.0.0.1:3000
      - key: MOGIC_STUDIO_DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: mogic-studio-postgres
          property: connectionString
      - key: MOGIC_STUDIO_DATABASE_POOL_MAX
        value: "5"
      - key: MOGIC_STUDIO_DATABASE_SSL
        value: "1"
      - key: MOGIC_STUDIO_ENCRYPTION_KEY
        generateValue: true
      - key: MOGIC_STUDIO_INSTALL_TOKEN
        generateValue: true
      - key: MOGIC_STUDIO_MAINTENANCE_TOKEN
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

  - type: worker
    name: mogic-studio-generation-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerCommand: node /app/web/scripts/generation-worker.mjs
    envVars:
      - fromGroup: mogic-studio-runtime
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: MOGIC_STUDIO_WORKER_API_ORIGIN
        fromService:
          name: mogic-studio
          type: web
          property: hostport

databases:
  - name: mogic-studio-postgres
    plan: basic-256mb
    databaseName: mogic_studio
    user: mogic_studio

envVarGroups:
  - name: mogic-studio-runtime
    envVars:
      - key: MOGIC_STUDIO_WORKER_TOKEN
        generateValue: true
